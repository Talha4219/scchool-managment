name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder-secret' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Non-blocking: matches next.config.ts's typescript.ignoreBuildErrors — the
      # codebase has pre-existing type debt (Prisma schema drift in prisma/seed.ts,
      # duplicate declarations in src/lib/types.ts) that isn't part of this pipeline
      # setup. Surfaced here for visibility without failing the pipeline on it.
      - name: Type check (non-blocking)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
